<button> Hello </button>

<script>
    // create a div
    const div = document.createElement('div')
    console.log(div)
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 10)
    div.setAttribute('title', "generated title")
    div.style.backgroundColor="green"
    div.style.padding = "12px"
    div.innerText = "Chai aur code" // innerHTML --> first bring the HTML written inside and then overwrite it. 2 steps hota hai 

    // another method is to create a taxt node and then append in the div

    const addText = document.createTextNode("Chai aur code")
   div.appendChild(addText)  // here also 2 steps hua 1st create & then append 

   // Now how to add it on the web page, abhi taak sirf Hello button web page pr present hai

// so append it on the body 
document.body.appendChild(div)

// Now we can create a function and give the parameters like text, background color etc.. and easily create a div

</script>
